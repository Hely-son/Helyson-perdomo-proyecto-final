# Nginx de entrega del frontend (TK-00.6; docs/ARCHITECTURE.md, "Docker Compose" > "Red y puertos").
# Sirve el build de Vite y reenvía /api/ al backend por la red interna de Compose (mismo origen, sin CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    autoindex off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Archivos ocultos (.env, .git, ...): nunca se sirven.
    location ~ /\. {
        return 404;
    }

    # API: proxy al backend (servicio `backend` de docker-compose.delivery.yml), sin fallback SPA.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api sin barra final: 404 directo, sin redirección ni fallback.
    location = /api {
        return 404;
    }

    # Assets del build de Vite: 404 real si no existen, sin fallback a index.html ni listado.
    location /assets/ {
        try_files $uri =404;
    }

    # index.html no se cachea. Un add_header en esta location anula los heredados: se repiten los de seguridad.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Rutas de navegación de la SPA: fallback a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
